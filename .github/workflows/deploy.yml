name: CI/CD Backend

on:
  push:
    branches: [ dev, deploy ]
  pull_request:
    branches: [ dev ]

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 147588477011
  CLUSTER_NAME: vidalcasino-eks

jobs:
  # ============================================
  # JOB 1: TESTS
  # ============================================
  tests:
    name: 1. Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  # ============================================
  # JOB 2: BUILD
  # ============================================
  build:
    name: 2. Build
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/deploy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        run: |
          docker build -t casino-backend .
          docker tag casino-backend:latest ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/casino-backend:latest
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/casino-backend:latest

  # ============================================
  # JOB 3: DEPLOY
  # ============================================
  deploy:
    name: 3. Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/deploy'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          kubectl set image deployment/casino-backend casino-backend=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/casino-backend:latest
          kubectl rollout status deployment/casino-backend
          kubectl get pods
