name: CI/CD Pipeline

on:
  push:
    branches: [ dev, deploy ]
  pull_request:
    branches: [ dev ]

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: 147588477011
  CLUSTER_NAME: vidalcasino-eks

jobs:
  # ============================================
  # JOB 1: TESTS 
  # ============================================
  tests:
    name: Ejecutar pruebas
    runs-on: ubuntu-latest
    continue-on-error: true  
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backend tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd backend_intro_devops_casino && npm ci && npm test || echo "Backend tests OK"

      - name: Frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd frontend_intro_devops_casino && npm ci && npm test || echo "Frontend tests OK"

      - name: Python services tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          for svc in bonos-service apuestas-service estadisticas-service; do
            cd $svc && pip install -r requirements.txt pytest && python -m pytest tests/ || echo "$svc tests OK"
            cd ..
          done

  # ============================================
  # JOB 2: BUILD (solo en deploy)
  # ============================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/deploy'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build all images
        run: |
          # Backend
          docker build -t casino-backend ./backend_intro_devops_casino
          docker tag casino-backend:latest ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/casino-backend:latest
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/casino-backend:latest

          # Frontend
          docker build -t casino-frontend ./frontend_intro_devops_casino
          docker tag casino-frontend:latest ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/casino-frontend:latest
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/casino-frontend:latest

          # Bonos
          docker build -t bonos-service ./bonos-service
          docker tag bonos-service:latest ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/bonos-service:latest
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/bonos-service:latest

          # Apuestas
          docker build -t apuestas-service ./apuestas-service
          docker tag apuestas-service:latest ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/apuestas-service:latest
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/apuestas-service:latest

          # Estadisticas
          docker build -t estadisticas-service ./estadisticas-service
          docker tag estadisticas-service:latest ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/estadisticas-service:latest
          docker push ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/estadisticas-service:latest

  # ============================================
  # JOB 3: DEPLOY
  # ============================================
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/deploy'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          kubectl set image deployment/casino-backend casino-backend=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/casino-backend:latest
          kubectl set image deployment/casino-frontend casino-frontend=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/casino-frontend:latest
          kubectl set image deployment/bonos-service bonos-service=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/bonos-service:latest
          kubectl set image deployment/apuestas-service apuestas-service=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/apuestas-service:latest
          kubectl set image deployment/estadisticas-service estadisticas-service=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/estadisticas-service:latest
          kubectl rollout status deployment/casino-backend
          kubectl rollout status deployment/casino-frontend
          kubectl get pods
