services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - casino-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - casino-net

  frontend:
    build: ../frontend_intro_devops_casino_vidal
    ports:
      - "8080:80"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 3000
    depends_on:
      - backend
    networks:
      - casino-net

volumes:
  pgdata:

networks:
  casino-net:
    driver: bridge